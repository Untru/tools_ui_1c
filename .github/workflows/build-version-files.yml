name: Сборка файлов поставки

on:
  workflow_call:
    inputs:
      tag_name:
        required: true
        type: string
      prerelease:
        required: true
        type: boolean
    secrets:
      ONEC_USERNAME:
        description: 'Имя пользователя портала 1С для скачивания дистрибутивов'
        required: true
      ONEC_PASSWORD:
        description: 'Пароль пользователя портала 1С для скачивания дистрибутивов'
        required: true  
jobs:
  export-xml:
    name: Экспорт исходников в формате конфигуратора
    runs-on: ubuntu-24.04
    # if: github.repository == 'cpr1c/tools_ui_1c'
    env:
      TOOLS_UI_1C_BUILDER_EDT_PATH: "/opt/1C/1CE/components/1c-edt-2024.1.3+13-x86_64/"
    defaults:
      run:
        shell: bash
    steps:
      - name: Извлечение исходников ветки ${{ github.ref_name }}
        if: github.event_name == 'push'
        uses: actions/checkout@v4
      - name: JAVA
        uses: actions/setup-java@v4
        with:
          distribution: "zulu" # See 'Supported distributions' for available options
          java-version: "17"

      - name: Установка 1C:EDT
        uses: 1CDevFlow/onec-setup-action@main
        with:
          type: edt
          edt_version: 2024.1.3
          cache: true
        env:
          ONEC_USERNAME: ${{ secrets.ONEC_USERNAME }}
          ONEC_PASSWORD: ${{ secrets.ONEC_PASSWORD }}
        timeout-minutes: 30

      - name: Setup Onescript Action
        uses: otymko/setup-onescript@v1.4
        with:
          version: 1.9.2

      # - name: Установка зависимостей Oscript
      #   run: opm install cli fs logos tempfiles v8runner v8find 1commands

      - name: Конвертация исходников
        run: oscript -encoding=utf-8 ./src/builder/build.os xml

      - name: Публикация исходников в формате конфигуратора
        uses: actions/upload-artifact@v4
        with:
          name: designer-src
          path: build/source
          if-no-files-found: error
          retention-days: 1

  export-xml-en:
    name: Экспорт исходников EN в формате конфигуратора
    runs-on: ubuntu-24.04
    env:
      TOOLS_UI_1C_BUILDER_EDT_PATH: "/opt/1C/1CE/components/1c-edt-2024.1.3+13-x86_64/"
    defaults:
      run:
        shell: bash
    steps:
      - name: Извлечение исходников ветки ${{ github.ref_name }}
        if: github.event_name == 'push'
        uses: actions/checkout@v4
      - name: JAVA
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Установка 1C:EDT
        uses: 1CDevFlow/onec-setup-action@main
        with:
          type: edt
          edt_version: 2024.1.3
          cache: true
        env:
          ONEC_USERNAME: ${{ secrets.ONEC_USERNAME }}
          ONEC_PASSWORD: ${{ secrets.ONEC_PASSWORD }}
        timeout-minutes: 30

      - name: Установка плагина LangTool
        run: |
          # Определяем исполняемый файл EDT (1cedt или eclipse)
          EDT_DIR="${{ env.TOOLS_UI_1C_BUILDER_EDT_PATH }}"
          if [ -f "${EDT_DIR}1cedt" ]; then
            EDT_EXE="${EDT_DIR}1cedt"
          elif [ -f "${EDT_DIR}eclipse" ]; then
            EDT_EXE="${EDT_DIR}eclipse"
          else
            echo "EDT executable not found, listing directory:"
            ls -la "${EDT_DIR}"
            exit 1
          fi
          echo "Using EDT executable: ${EDT_EXE}"
          "${EDT_EXE}" \
            -application org.eclipse.equinox.p2.director \
            -noSplash \
            -repository https://edt.1c.ru/downloads/releases/plugins/language-tool/edt-2024.1/1.6.0/repo/ \
            -destination "${EDT_DIR}" \
            -installIU com.e1c.langtool.feature.feature.group

      - name: Наложение словаря перевода EN и экспорт через EDT
        run: |
          set -e
          EDT_CLI="${{ env.TOOLS_UI_1C_BUILDER_EDT_PATH }}1cedtcli"
          PROJECT_DIR="src/Инструменты"
          PROJECT_NAME="tools_ui_1c"
          WS_DIR="/tmp/edt-ws-en"
          OUTPUT_DIR="build/source/Инструменты"

          # 1. Наложение словаря перевода
          cp -r translate/en/src/* "${PROJECT_DIR}/src/"
          echo "Словарь перевода наложен"

          # 2. Настройки LangTool
          mkdir -p "${PROJECT_DIR}/.settings"
          printf '%s\n' \
            "eclipse.preferences.version=1" \
            "translationProperties/contextDefStorageCheckBackTranslation=true" \
            "translationProperties/fillEmptyHelpTranslationFromSource=true" \
            "translationProperties/fillEmptyHtmlTranslationFromSource=true" \
            "translationProperties/fillEmptyInterfaceTranslationFromSource=true" \
            > "${PROJECT_DIR}/.settings/com.e1c.langtool.v8.dt.prefs"
          echo "LangTool prefs созданы"
          cat "${PROJECT_DIR}/.settings/com.e1c.langtool.v8.dt.prefs"

          # 3. Переименование проекта в ASCII (EDT CLI не работает с кириллицей в аргументах)
          cp "${PROJECT_DIR}/.project" "${PROJECT_DIR}/.project.bak"
          sed -i "s|<name>Инструменты</name>|<name>${PROJECT_NAME}</name>|" "${PROJECT_DIR}/.project"
          ln -s "Инструменты" "src/${PROJECT_NAME}" || cp -al "${PROJECT_DIR}" "src/${PROJECT_NAME}"
          echo "Проект переименован в ${PROJECT_NAME}"

          # 3b. Проверка что файлы перевода на месте
          echo "Translation files count:"
          find "${PROJECT_DIR}/src" -name "*_en.lstr" -o -name "*_en.trans" | wc -l

          # 4. Подготовка каталогов
          rm -rf "${WS_DIR}" "${OUTPUT_DIR}"
          mkdir -p "${WS_DIR}" "${OUTPUT_DIR}"

          # 5. EDT Import (файлы перевода .lstr/.trans уже в проекте — LangTool подхватит)
          cd src
          "${EDT_CLI}" -data "${WS_DIR}" \
            -vmargs -DdisableProjectChecks=true -DdisableFTS=true \
            -command import --project "${PROJECT_NAME}"
          echo "Import OK"

          # 6. EDT Export (экспорт из workspace в формат конфигуратора)
          # Остаёмся в src/ — export ищет проект по имени в текущем каталоге
          ABS_OUTPUT="$(cd .. && pwd)/${OUTPUT_DIR}"
          mkdir -p "${ABS_OUTPUT}"
          "${EDT_CLI}" -data "${WS_DIR}" -timeout 9000 \
            -vmargs -DdisableProjectChecks=true -DdisableFTS=true \
            -command export --project "${PROJECT_NAME}" \
            --configuration-files "${ABS_OUTPUT}"
          cd ..
          echo "Export OK"

          # 7. Восстановление
          rm -f "src/${PROJECT_NAME}" 2>/dev/null || rm -rf "src/${PROJECT_NAME}" 2>/dev/null || true
          mv -f "${PROJECT_DIR}/.project.bak" "${PROJECT_DIR}/.project"

          # 8. Проверка
          if [ -f "${OUTPUT_DIR}/Configuration.xml" ]; then
            echo "Исходники EN готовы в ${OUTPUT_DIR}"
            # Проверка наличия перевода — ищем язык en в XML
            echo "=== ��роверка перевода ==="
            grep -c "lang=\"en\"" "${OUTPUT_DIR}/Configuration.xml" || echo "Нет lang=en в Configuration.xml"
            SAMPLE_MDO=$(find "${OUTPUT_DIR}" -name "*.xml" -path "*/CommonModules/*" | head -1)
            if [ -n "$SAMPLE_MDO" ]; then
              echo "Sample: $SAMPLE_MDO"
              grep "lang\|Synonym\|content" "$SAMPLE_MDO" | head -5 || true
            fi
          else
            echo "ОШИБКА: Configuration.xml не н��йден"
            exit 1
          fi
        timeout-minutes: 30

      - name: Экспорт портативного проекта
        run: |
          EDT_CLI="${{ env.TOOLS_UI_1C_BUILDER_EDT_PATH }}1cedtcli"
          "${EDT_CLI}" -data /tmp/edt-ws-portable \
            -vmargs -DdisableProjectChecks=true -DdisableFTS=true \
            -command export --project "src/Портативный" \
            --configuration-files "build/source/Портативный"
        timeout-minutes: 30

      - name: Публикация исходников EN в формате конфигуратора
        uses: actions/upload-artifact@v4
        with:
          name: designer-src-en
          path: build/source
          if-no-files-found: error
          retention-days: 1

  build-github:
    name: Сборка файлов инструментов cfe/cf
    runs-on: ubuntu-22.04
    needs: export-xml
    env:
      TOOLS_UI_1C_BUILDER_PLATFORM_PATH: "/opt/1C/v8.3/x86_64/"

    steps:
      - name: Извлечение исходников ветки ${{ github.ref_name }}
        if: github.event_name == 'push'
        uses: actions/checkout@v4

      - name: Загрузка исходников в формате конфигуратора
        uses: actions/download-artifact@v4
        with:
          name: designer-src
          path: build/source

      - name: Установка 1С:Предприятие 8.3.17.2760
        uses: 1CDevFlow/onec-setup-action@main
        with:
          type: onec
          onec_version: 8.3.17.2760
          cache: true
        env:
          ONEC_USERNAME: ${{ secrets.ONEC_USERNAME }}
          ONEC_PASSWORD: ${{ secrets.ONEC_PASSWORD }}
        timeout-minutes: 30

      - name: Установка зависимостей платформы
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc libcups2 libfontconfig1 libgsf-1-114 \
            libgtk-3-0 libcanberra-gtk3-module libsm6 libice6 libglu1-mesa libsoup2.4-1
          # Заглушка libwebkitgtk (deprecated, не нужна для batch-mode)
          echo 'void __attribute__((constructor)) _stub(void) {}' | \
            gcc -shared -x c - -o /tmp/libstub.so
          sudo cp /tmp/libstub.so /usr/lib/x86_64-linux-gnu/libwebkitgtk-3.0.so.0
          sudo cp /tmp/libstub.so /usr/lib/x86_64-linux-gnu/libjavascriptcoregtk-3.0.so.0
          sudo ldconfig

      - name: Setup Onescript Action
        uses: otymko/setup-onescript@v1.4
        with:
          version: 1.9.2

      - name: Сборка расширений
        run: oscript -encoding=utf-8 ./src/builder/build.os cfe
        timeout-minutes: 30

      - name: Сборка конфигураций
        run: oscript -encoding=utf-8 ./src/builder/build.os cf
        timeout-minutes: 30
      - name: Публикация файлов
        uses: softprops/action-gh-release@v2
        if: ${{ success() }}
        with:
          prerelease: ${{ inputs.prerelease }}
          files: |
            build/*.cfe
            build/*.cf
          fail_on_unmatched_files: true
          generate_release_notes: false
          tag_name: ${{ inputs.tag_name }}
          # append_body: false
          # name: Ночная сборка по коммиту ${{ github.event.head_commit.message  }}
          token: ${{ secrets.GITHUB_TOKEN }}
          # body: Сборка актуальной версии в разработке по последнему коммиту из ветки develop

  build-github-en:
    name: Сборка файлов инструментов cfe/cf (EN)
    runs-on: ubuntu-22.04
    needs: export-xml-en
    env:
      TOOLS_UI_1C_BUILDER_PLATFORM_PATH: "/opt/1C/v8.3/x86_64/"

    steps:
      - name: Извлечение исходников ветки ${{ github.ref_name }}
        if: github.event_name == 'push'
        uses: actions/checkout@v4

      - name: Загрузка исходников EN в формате конфигуратора
        uses: actions/download-artifact@v4
        with:
          name: designer-src-en
          path: build/source

      - name: Установка 1С:Предприятие 8.3.17.2760
        uses: 1CDevFlow/onec-setup-action@main
        with:
          type: onec
          onec_version: 8.3.17.2760
          cache: true
        env:
          ONEC_USERNAME: ${{ secrets.ONEC_USERNAME }}
          ONEC_PASSWORD: ${{ secrets.ONEC_PASSWORD }}
        timeout-minutes: 30

      - name: Установка зависимостей платформы
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc libcups2 libfontconfig1 libgsf-1-114 \
            libgtk-3-0 libcanberra-gtk3-module libsm6 libice6 libglu1-mesa libsoup2.4-1
          # Заглушка libwebkitgtk (deprecated, не нужна для batch-mode)
          echo 'void __attribute__((constructor)) _stub(void) {}' | \
            gcc -shared -x c - -o /tmp/libstub.so
          sudo cp /tmp/libstub.so /usr/lib/x86_64-linux-gnu/libwebkitgtk-3.0.so.0
          sudo cp /tmp/libstub.so /usr/lib/x86_64-linux-gnu/libjavascriptcoregtk-3.0.so.0
          sudo ldconfig

      - name: Setup Onescript Action
        uses: otymko/setup-onescript@v1.4
        with:
          version: 1.9.2

      - name: Сборка расширений
        run: oscript -encoding=utf-8 ./src/builder/build.os cfe
        timeout-minutes: 30

      - name: Сборка конфигураций
        run: oscript -encoding=utf-8 ./src/builder/build.os cf
        timeout-minutes: 30

      - name: Переименование файлов с суффиксом _en
        run: |
          for f in build/*.cfe; do mv "$f" "${f%.cfe}_en.cfe"; done
          for f in build/*.cf; do mv "$f" "${f%.cf}_en.cf"; done

      - name: Публикация файлов
        uses: softprops/action-gh-release@v2
        if: ${{ success() }}
        with:
          prerelease: ${{ inputs.prerelease }}
          files: |
            build/*.cfe
            build/*.cf
          fail_on_unmatched_files: true
          generate_release_notes: false
          tag_name: ${{ inputs.tag_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

  build-portable:
    name: Сборка файлов портативной поставки
    runs-on: ubuntu-22.04
    needs: export-xml
    env:
      TOOLS_UI_1C_BUILDER_PLATFORM_PATH: "/opt/1cv8/x86_64/8.3.27.1989/"

    steps:
      - name: Извлечение исходников ветки ${{ github.ref_name }}
        if: github.event_name == 'push'
        uses: actions/checkout@v4

      - name: Загрузка исходников в формате конфигуратора
        uses: actions/download-artifact@v4
        with:
          name: designer-src
          path: build/source

      - name: Установка 1С:Предприятие 8.3.27.1989
        uses: 1CDevFlow/onec-setup-action@main
        with:
          type: onec
          onec_version: 8.3.27.1989
          cache: true
        env:
          ONEC_USERNAME: ${{ secrets.ONEC_USERNAME }}
          ONEC_PASSWORD: ${{ secrets.ONEC_PASSWORD }}
        timeout-minutes: 30

      - name: Setup Onescript Action
        uses: otymko/setup-onescript@v1.4
        with:
          version: 1.9.2

      - name: Сборка портативной
        run: oscript -encoding=utf-8 src/builder/build.os epf
        timeout-minutes: 30

      - name: Публикация файлов
        uses: softprops/action-gh-release@v2
        if: ${{ success() }}
        with:
          prerelease: ${{ inputs.prerelease }}
          files: build/*.epf
          fail_on_unmatched_files: true
          # generate_release_notes: false
          tag_name: ${{ inputs.tag_name }}
          # append_body: false
          # name: Ночная сборка по коммиту "${{ github.event.head_commit.message }}"
          token: ${{ secrets.GITHUB_TOKEN }}
          # body: Сборка актуальной версии в разработке по последнему коммиту из ветки develop

  build-portable-en:
    name: Сборка файлов портативной поставки (EN)
    runs-on: ubuntu-22.04
    needs: export-xml-en
    env:
      TOOLS_UI_1C_BUILDER_PLATFORM_PATH: "/opt/1cv8/x86_64/8.3.27.1989/"

    steps:
      - name: Извлечение исходников ветки ${{ github.ref_name }}
        if: github.event_name == 'push'
        uses: actions/checkout@v4

      - name: Загрузка исходников EN в формате конфигуратора
        uses: actions/download-artifact@v4
        with:
          name: designer-src-en
          path: build/source

      - name: Установка 1С:Предприятие 8.3.27.1989
        uses: 1CDevFlow/onec-setup-action@main
        with:
          type: onec
          onec_version: 8.3.27.1989
          cache: true
        env:
          ONEC_USERNAME: ${{ secrets.ONEC_USERNAME }}
          ONEC_PASSWORD: ${{ secrets.ONEC_PASSWORD }}
        timeout-minutes: 30

      - name: Setup Onescript Action
        uses: otymko/setup-onescript@v1.4
        with:
          version: 1.9.2

      - name: Сборка портативной
        run: oscript -encoding=utf-8 src/builder/build.os epf
        timeout-minutes: 30

      - name: Переименование файлов с суффиксом _en
        run: |
          for f in build/*.epf; do mv "$f" "${f%.epf}_en.epf"; done

      - name: Публикация файлов
        uses: softprops/action-gh-release@v2
        if: ${{ success() }}
        with:
          prerelease: ${{ inputs.prerelease }}
          files: build/*.epf
          fail_on_unmatched_files: true
          tag_name: ${{ inputs.tag_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
