name: Прогрев кеша платформы

on:
  workflow_dispatch:

jobs:
  warm-8317:
    name: Кеш 8.3.17.2760
    runs-on: ubuntu-22.04
    steps:
      - name: Скачивание и установка дистрибутива
        run: |
          gh release download cache-warm --repo Untru/tools_ui_1c --pattern "client_8_3_17_2760.deb64.tar.gz" --dir /tmp
          mkdir -p /tmp/debs
          tar xzf /tmp/client_8_3_17_2760.deb64.tar.gz -C /tmp/debs
          ls /tmp/debs/
          sudo dpkg -i --force-all /tmp/debs/*.deb
          echo "=== Installed ==="
          find /opt -maxdepth 4 -type d | grep -i "1[cC]\|1cv8" | head -10
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Подготовка пути для кеша
        run: |
          # Action ищет кеш по пути /opt/1C/v8.3
          sudo mkdir -p /opt/1C/v8.3
          # Копируем файлы платформы в ожидаемый путь
          if [ -d /opt/1cv8 ]; then
            sudo cp -a /opt/1cv8/* /opt/1C/v8.3/ 2>/dev/null || true
          fi
          ls /opt/1C/v8.3/

      - name: Сохранение в кеш
        uses: actions/cache/save@v4
        with:
          path: /opt/1C/v8.3
          key: setup--onec--8.3.17.2760--linux

  warm-8327:
    name: Кеш 8.3.27.1989
    runs-on: ubuntu-22.04
    steps:
      - name: Скачивание и установка дистрибутива
        run: |
          gh release download cache-warm --repo Untru/tools_ui_1c --pattern "client_8_3_27_1989.deb64.zip" --dir /tmp
          mkdir -p /tmp/debs
          unzip -o /tmp/client_8_3_27_1989.deb64.zip -d /tmp/debs
          ls /tmp/debs/
          sudo dpkg -i --force-all /tmp/debs/*.deb
          echo "=== Installed ==="
          find /opt -maxdepth 4 -type d | grep -i "1[cC]\|1cv8" | head -10
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Подготовка пути для кеша
        run: |
          # Action 8.3.27 ищет кеш в /opt/1cv8
          sudo mkdir -p /opt/1cv8
          if [ -d /opt/1C/v8.3 ]; then
            sudo cp -a /opt/1C/v8.3/* /opt/1cv8/ 2>/dev/null || true
          fi
          ls /opt/1cv8/

      - name: Сохранение в кеш
        uses: actions/cache/save@v4
        with:
          path: /opt/1cv8
          key: setup--onec--8.3.27.1989--linux
