name: Прогрев кеша платформы

on:
  workflow_dispatch:

jobs:
  warm-8317:
    name: Кеш 8.3.17.2760
    runs-on: ubuntu-22.04
    steps:
      - name: Скачивание и установка дистрибутива
        run: |
          gh release download cache-warm --repo Untru/tools_ui_1c --pattern "deb64_8_3_17_2760.tar.gz" --dir /tmp
          gh release download cache-warm --repo Untru/tools_ui_1c --pattern "client_8_3_17_2760.deb64.tar.gz" --dir /tmp
          mkdir -p /tmp/debs
          tar xzf /tmp/deb64_8_3_17_2760.tar.gz -C /tmp/debs
          tar xzf /tmp/client_8_3_17_2760.deb64.tar.gz -C /tmp/debs
          sudo apt-get update -qq
          sudo apt-get install -y -qq libfontconfig1 libgsf-1-114 libglib2.0-0
          sudo dpkg -i --force-all /tmp/debs/*.deb
          echo "=== Installed ==="
          ls /opt/1C/v8.3/x86_64/1cv8 && echo "1cv8 OK"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Сохранение в кеш
        uses: actions/cache/save@v4
        with:
          path: /opt/1C/v8.3
          key: setup--onec--8.3.17.2760--linux

  warm-8327:
    name: Кеш 8.3.27.1989
    runs-on: ubuntu-22.04
    steps:
      - name: Скачивание и установка дистрибутива
        run: |
          gh release download cache-warm --repo Untru/tools_ui_1c --pattern "deb64_8_3_27_1989.zip" --dir /tmp
          gh release download cache-warm --repo Untru/tools_ui_1c --pattern "client_8_3_27_1989.deb64.zip" --dir /tmp
          mkdir -p /tmp/debs
          unzip -o /tmp/deb64_8_3_27_1989.zip -d /tmp/debs
          unzip -o /tmp/client_8_3_27_1989.deb64.zip -d /tmp/debs
          sudo apt-get update -qq
          sudo apt-get install -y -qq libfontconfig1 libgsf-1-114 libglib2.0-0
          sudo dpkg -i --force-all /tmp/debs/*.deb
          echo "=== Installed ==="
          find /opt -name "1cv8" -type f
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Подготовка пути для кеша
        run: |
          # Action 8.3.27 ищет кеш в /opt/1cv8
          if [ ! -d /opt/1cv8 ]; then
            sudo mkdir -p /opt/1cv8
            sudo cp -a /opt/1C/v8.3/* /opt/1cv8/ 2>/dev/null || true
          fi
          ls /opt/1cv8/

      - name: Сохранение в кеш
        uses: actions/cache/save@v4
        with:
          path: /opt/1cv8
          key: setup--onec--8.3.27.1989--linux
