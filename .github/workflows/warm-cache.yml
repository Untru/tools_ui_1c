          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Сохранение в кеш
        uses: actions/cache/save@v4
        with:
          path: |
            /opt/1C
            /opt/1cv8
          key: setup--onec--8.3.27.1989--linux
